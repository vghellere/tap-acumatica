send_anonymous_usage_stats: true
project_id: "tap-acumatica"
default_environment: test
requires_meltano: ">=4.0"
environments:
- name: test
plugins:
  extractors:
  - name: "tap-acumatica"
    namespace: "tap_acumatica"
    pip_url: -e .
    capabilities:
    - state
    - catalog
    - discover
    - about
    - stream-maps
    - structured-logging

    # TODO: Declare settings and their types here:
    settings:
    - name: client_id
      label: Client ID
      description: OAuth client ID for the Acumatica OAuth app
      sensitive: true

    - name: client_secret
      label: Password
      description: OAuth client secret for the Acumatica OAuth app
      sensitive: true

    - name: refresh_token
      label: Refresh Token
      description: OAuth refresh token for the Acumatica OAuth app
      sensitive: true

    - name: start_date
      kind: date_iso8601
      label: Start Date
      description: Initial date to start extracting data from

    - name: api_url
      label: API URL
      description: Acumatica site URL, such as http://host/AcumaticaSandbox

    # TODO: Declare required settings here:
    settings_group_validation:
    - [api_url, client_id, client_secret]

    # TODO: Declare default configuration values here:
    config:
      start_date: 6 months ago

  loaders:
  - name: target-jsonl
    variant: andyh1203
    pip_url: target-jsonl
